# Netlify Configuration for Fazah Auto Garage App
[build]
  base = "."
  command = "npm run build --workspace=apps/kiosk"
  publish = "apps/kiosk/dist"

# Disable Netlify Drawer (Feedback widget / Netlify badge)
[context.deploy-preview.environment]
  NETLIFY_DRAWER_ENABLED = "false"

[context.branch-deploy.environment]
  NETLIFY_DRAWER_ENABLED = "false"


# Proxy /api requests to Render backend (seamless, no CORS, no client config required)
[[redirects]]
  from = "/api/*"
  to = "https://fazah-staff-attendance-app.onrender.com/api/:splat"
  status = 200
  force = true

# Client-side routing for Single Page Application (SPA)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache static assets and service worker correctly
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
