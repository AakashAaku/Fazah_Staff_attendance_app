services:
  - type: web
    name: fazah-staff-attendance-app
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run build -w apps/api
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
