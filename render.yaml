services:
  - type: web
    name: fazah-garage-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run build -w apps/api
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: fazah-garage-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: fazah-garage-db
    plan: free
    region: frankfurt
